    Research Experience:
      - company: University of Wyoming
        position: Graduate Research Assistant
        location: Laramie, WY, USA
        start_date: 2025
        end_date: present
        highlights:
          - "Built an axisymmetric solids4Foam (FVM) model of a proppant grain pressed into a rock wall (Mohr–Coulomb rock, penalty contact, O-grid mesh checked against Hertz theory) that runs a full loading–unloading cycle, separating permanent embedment from elastic recovery; being extended to fracture flow"
          - "Validated the model against published Brinell indentation data on Montney siltstone (22 samples, 35 N) with no parameter fitting: the finest-mesh peak depth (17.1 µm, +12.5% vs. the 15.2 µm mean) lies within the measured 9.7–19.2 µm range"
          - "Predicted eight published proppant-embedment tests blind (69% mean absolute error) and identified a grain-size scaling mismatch that mesh error does not explain: size exponent ≈1 predicted vs. 0.47 measured"
          - "Ran nested group cross-validation (60 folds) of a dimensionless residual-depth correlation (5.2% error on simulations) and traced a mesh-resolution bias in its training data, now being re-solved on a uniform mesh"
          - "Run my simulation campaigns through an AI coding agent (Claude Code), committing test matrices and pass/fail rules to Git before each campaign (426 runs archived); set up container runs on UW’s HPC cluster"
          - "Training simulation-based inverse models with split-conformal 90% intervals to find which indentation measurement can identify the dilation angle; the answer will decide whether the rig needs a profilometer"
          - "Trained in triaxial cell operation (confining and pore-pressure control) and rock compressibility (bulk modulus) testing on DCI equipment"
          - "Designed and built a displacement-controlled micro-indentation rig in-house (parametric CAD, 3D-printed fixtures, 1 mm tungsten-carbide ball on a screw-press stage) to record P–h curves of rock and metal specimens; picked a 445 N load cell (0.004 N resolution) for 35 N tests, paired it with laser Doppler vibrometry, recorded both channels through an NI USB-6341 DAQ in LabVIEW, and debugged interference between them"

      - company: KAIST — Graduate School of Mechanical Engineering
        position: Research Intern (6-month full-time)
        location: South Korea
        start_date: 2024
        end_date: 2025
        highlights:
          - "Advisor: Dr. Yeunwoo Cho"
          - "Investigated gravity–capillary wave dynamics on elastic silicone films subjected to continuous air-blow loading above water"
          - "Derived dispersion relations for gas–solid–liquid interface interactions under nonlinear elastic coupling"
          - "Developed 2D ventilated supercavitation models and introduced wake-theory-based modifications, significantly improving agreement between theoretical predictions and experimental data for cavitator-driven cavity asymmetry"
          - "Conducted vortex–wave interaction CFD simulations near free surfaces using ANSYS Fluent; analyzed free-surface-induced von Kármán vortex asymmetry mechanisms"

