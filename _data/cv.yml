    Research Experience:
      - company: University of Wyoming
        position: Graduate Research Assistant
        location: Laramie, WY, USA
        start_date: 2025
        end_date: present
        highlights:
          - "Question: how deep does a grain permanently sink into rock, and which rock property decides it?"
          - "To predict how deep a proppant grain permanently sinks into a fracture wall, built an axisymmetric finite-volume model (OpenFOAM + solids4Foam) that presses a 1 mm tungsten-carbide ball into Mohr–Coulomb rock and then unloads it, so permanent embedment separates from elastic recovery; every rock input is a published Montney siltstone measurement, with nothing tuned to fit"
          - "Validated it against published Brinell tests (22 Montney samples, 35 N) on three successively finer meshes: peak depth 15.2, 16.6 and 17.1 µm against 15.2 ± 2.4 µm measured, all inside the sample range"
          - "Predicted eight published proppant-pack tests blind (69% mean absolute error), then reran all eight on a uniform mesh and with dilation turned on: the misfit grows with grain size (depth exponent ≈1.0 in the model vs. 0.47 measured) and neither change removes it, so I report it as an open problem instead of tuning it away"
          - "Found through one-at-a-time sweeps that the least-measured input matters most: a 10° dilation angle cuts residual depth by 45% and moves the permanent fraction from 67% to 44%, near the ≈40% measured, yet no one has measured that angle for these samples"
          - "Condensed the sweeps into a screening correlation (h_res/R = 0.0031 Π^0.72, R² = 0.88), then stress-tested a richer version by nested cross-validation (60 folds, 5.2% error); the test exposed a mesh bias in its training data (×1.31), so it stays out of the manuscript until the data are re-solved"
          - "Now turning that dilation-angle gap into a machine-learning question: training inverse models (kNN, gradient-boosted trees, TabPFN, 1-D CNN) on ≈250 new simulations with split-conformal 90% intervals to learn which indentation measurement can pin the angle down; the answer decides whether my rig needs a profilometer (Fall 2026)"
          - "Designed and built the rig that will supply those measurements: a displacement-controlled micro-indentation setup with 3D-printed fixtures refined through up to 20 revisions per part, a 445 N load cell (0.004 N resolution) and a laser Doppler vibrometer read through an NI DAQ in LabVIEW; debugged the interference between the two channels"
          - "Run every campaign through an AI coding agent (Claude Code) under test plans and pass/fail rules committed to Git before any run: 426 runs and ≈1,400 core-hours so far, now containerized on UW’s MedicineBow cluster"
          - "Put my own manuscript through three rounds of adversarial AI review (15, 37 and 60 items); one outcome was retracting my headline −0.8% validation figure once finer meshes showed it had not converged"

      - company: KAIST — Graduate School of Mechanical Engineering
        position: Research Intern (6-month full-time)
        location: South Korea
        start_date: 2024
        end_date: 2025
        highlights:
          - "Advisor: Dr. Yeunwoo Cho"
          - "Question: how does a boundary that bends or opens change the flow next to it?"
          - "Sole investigator on a government-funded study of waves driven by an air jet over a thin elastic film on water: derived the dispersion relation with the film’s bending stiffness and tension, located the minimum phase speed where the pattern turns into Kelvin waves, and confirmed it on high-speed video at six jet speeds (19–44 cm/s)"
          - "Assembled a free-surface cavitation tank from parts and worked out why a ventilated supercavity contracts on its upper wall near the surface: adding a wake-theory term to the closure condition of a 2D model substantially narrowed the gap between predicted and photographed outlines"
          - "Simulated von Kármán vortex shedding near a free surface (ANSYS Fluent, VOF): the closer the surface, the lower the Strouhal number and the weaker the upper vortices"

      - company: Pusan National University — Department of Naval Architecture & Ocean Engineering
        position: Undergraduate Research Assistant
        location: South Korea
        start_date: 2022
        end_date: 2024
        highlights:
          - "Question: what does the water do to the hull?"
          - "My first CFD project: validated RANS CFD of KCS hull resistance against the Gothenburg 2010 benchmark (STAR-CCM+, ≈4.4 M cells) to within 1.16% of the measured total resistance coefficient; my part was the mesh, refining the bow, stern and free surface and re-running after every change"
          - "Evaluated how an airfoil appendage changes a small vessel’s hull attitude and resistance (ANSYS Fluent)"
          - "Ran PIV and hull-resistance tests and designed a propulsion system to ITTC 1957/1978 standards"
          - "Started the vibration/acoustic anomaly-detection model (MATLAB, Python) that I later finished at Samsung"

