    Research Experience:
      - company: University of Wyoming
        position: Graduate Research Assistant
        location: Laramie, WY, USA
        start_date: 2025
        end_date: present
        highlights:
          - "Built an axisymmetric finite-volume model (OpenFOAM + solids4Foam) that presses a 1 mm tungsten-carbide ball into Mohr–Coulomb rock and unloads it, separating permanent embedment from elastic recovery; every rock input is a published Montney measurement and no parameter is fitted"
          - "Validated it on three successively finer meshes against published Brinell tests (22 samples, 35 N): peak depth 15.2, 16.6, 17.1 µm vs. 15.2 ± 2.4 µm measured, all inside the sample range; then predicted eight published proppant-pack tests blind (69% mean absolute error)"
          - "Traced the blind misfit to grain size (depth exponent ≈1.0 in the model vs. 0.47 measured): reran all eight cases on a uniform mesh and with dilation on, showed that neither removes it, and reported it as an open problem"
          - "Showed by one-at-a-time sweeps that the least-measured input matters most: a 10° dilation angle cuts residual depth 45% and moves the permanent fraction from 67% to 44% (measured ≈40%); also that a softer grain (600 to 13 GPa) raises total closure 74% but cuts permanent rock damage 49%"
          - "Condensed the sweeps into a screening correlation (h_res/R = 0.0031 Π^0.72, R² = 0.88); a richer version passed nested cross-validation (60 folds, 5.2% error), but the test exposed a ×1.31 mesh bias in its training data, so it stays out of the manuscript until re-solved"
          - "Now turning the dilation-angle gap into an inverse-ML problem: training kNN, gradient-boosted trees, TabPFN and a 1-D CNN on ≈250 new simulations with split-conformal 90% intervals to find which indentation measurement pins the angle down; the answer decides whether the rig gets a profilometer (Fall 2026)"
          - "Designed and built the rig for those measurements: displacement-controlled micro-indentation with 3D-printed fixtures refined through up to 20 revisions per part, a 445 N load cell (0.004 N resolution) and a laser Doppler vibrometer read at 2 kHz through an NI DAQ in LabVIEW; debugged the cross-talk between the two channels"
          - "Run every campaign through an AI coding agent (Claude Code) with test plans and pass/fail rules committed to Git before any run: 426 runs, ≈1,400 core-hours, inputs spanning E 18–85 GPa, c 4–30 MPa, φ 26–55°, ψ 0–10°, R 0.07–1.3 mm; the 121 manuscript runs are archived with mesh files and scripts that regenerate every figure and statistic; runs now containerized on UW’s MedicineBow cluster"
          - "Put the manuscript through three rounds of adversarial AI review (15, 37 and 60 items) and retracted my own headline −0.8% validation figure when finer meshes showed it had not converged"

      - company: KAIST — Graduate School of Mechanical Engineering
        position: Research Intern (6-month full-time)
        location: South Korea
        start_date: 2024
        end_date: 2025
        highlights:
          - "Advisor: Dr. Yeunwoo Cho"
          - "Sole investigator on a government-funded study of waves driven by an air jet over a thin elastic film on water: derived the dispersion relation with the film’s bending stiffness and tension, located the minimum phase speed where the pattern turns into Kelvin waves, and confirmed it on high-speed video at six jet speeds (19–44 cm/s)"
          - "Assembled a free-surface cavitation tank from parts and worked out why a ventilated supercavity contracts on its upper wall near the surface: adding a wake-theory term to the closure condition of a 2D model substantially narrowed the gap between predicted and photographed outlines"
          - "Simulated von Kármán vortex shedding near a free surface (ANSYS Fluent, VOF): the closer the surface, the lower the Strouhal number and the weaker the upper vortices"

      - company: Pusan National University — Department of Naval Architecture & Ocean Engineering
        position: Undergraduate Research Assistant
        location: South Korea
        start_date: 2022
        end_date: 2024
        highlights:
          - "First CFD project: validated RANS CFD of KCS hull resistance against the Gothenburg 2010 benchmark (STAR-CCM+, ≈4.4 M cells) to within 1.16% of the measured total resistance coefficient; owned the mesh, refining bow, stern and free surface and re-running after every change"
          - "PIV and hull-resistance testing, propulsion design to ITTC 1957/1978 standards, and an ANSYS Fluent study of how an airfoil appendage changes hull attitude and resistance"
          - "Started the vibration/acoustic anomaly-detection model (MATLAB, Python) that I later finished at Samsung"

